name: CI

# The machine-enforced quality floor promised in the orchestration DoD (section 9):
# the original three gates plus policy lint now run on
# every push to master and every pull request. Keep this in lockstep with the
# local gates documented in docs/deploy.md.

on:
  push:
    branches: [master]
  pull_request:

# One run per ref; a newer push cancels an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    env:
      # Build must never call the paid coaching service or need real secrets.
      AI_MOCK: 'true'
      # Public client vars are read at build time; placeholders keep next build green.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Policy lint (tokens, copy, debug code)
        run: npm run lint

      - name: Unit tests (node --test)
        run: npm run test

      - name: Production build (next build)
        run: npm run build

      # Report-only, never blocks. The labeled eval cases are footage-derived and
      # gitignored, so CI has none to measure: this only smoke-checks that the
      # coverage tool runs. The enforcing gate is local, before a baseline:
      # `node scripts/eval-coverage.mjs --strict` (see evals/LABELING.md).
      - name: Eval coverage (report only, non-blocking)
        continue-on-error: true
        run: node scripts/eval-coverage.mjs
